# Alembic configuration for local SQLite migrations.
#
# Canonical migration chain for the local (desktop) SQLite database.
# Run every command from the repository root:
#
#   alembic -c packages/storage/storage/migrations/alembic.ini upgrade head
#
# The target database comes from ALEMBIC_SQLITE_URL, then LOCAL_DATABASE_URL,
# then the sqlalchemy.url below. The default is relative to the working
# directory, so always set one of the variables when invoking from the root.

[alembic]
# %(here)s resolves to this file's directory, so no `cd` is required.
script_location = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///inven_tory_local.db
truncate_slug_length = 40
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
