[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inven-tory-storage"
version = "1.1.0"
description = "INVENTORY Tory — SQLite models, migrations, and local persistence"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "See repository LICENSE" }
dependencies = [
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.0",
    "python-ulid>=2.7.0",
    "inven-tory-domain",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["storage*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.black]
target-version = ["py312"]
line-length = 100
