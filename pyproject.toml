# Root pyproject.toml — tool configuration only.
# Individual service/package pyproject.toml files declare their own dependencies.
# This file provides consistent ruff and black settings for all Python code.

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "dist",
    "build",
    "*.egg-info",
    "infra/migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations (warn on missing type hints)
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG"]  # Relaxed annotation + unused-arg rules in tests
"**/tests/**/*.py" = ["ANN", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["app", "domain", "storage"]

[tool.black]
target-version = ["py312"]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | dist
  | build
  | \.eggs
  | \.mypy_cache
  | \.ruff_cache
  | infra/migrations/versions
)/
'''

[tool.pytest.ini_options]
testpaths = [
    "services/api/tests",
    "packages/domain/tests",
    "packages/storage/tests",
]
# Ensure each package root is on sys.path so `from app.xxx import` and
# `from storage.xxx import` resolve correctly regardless of which directory
# pytest is invoked from.  The packages themselves are also pip-installed as
# editable installs in CI, so this is belt-and-braces for local runs.
pythonpath = [
    "services/api",
    "packages/storage",
    "packages/domain",
]
addopts = "-v --tb=short"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
