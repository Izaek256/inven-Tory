# Alembic configuration — invenTory central PostgreSQL migrations
#
# The canonical migration chain for the central PostgreSQL database.
# Run every command from the repository root:
#
#   alembic -c infra/migrations/alembic.ini upgrade head
#
# The database URL comes from ALEMBIC_DB_URL, then DATABASE_URL, then the
# sqlalchemy.url value below.

[alembic]
# Path to migration scripts directory. %(here)s resolves to this file's
# directory, so no `cd` is required regardless of the caller's working dir.
script_location = %(here)s

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Database URL — override via ALEMBIC_DB_URL env var or DATABASE_URL env var (preferred)
# The value below is only used if neither env var is set.
# If your password contains special chars, percent-encode them (@ → %40).
sqlalchemy.url = postgresql+asyncpg://postgres:changeme@localhost:5432/inventory

# Truncate long messages in the console
truncate_slug_length = 40

# Output encoding
output_encoding = utf-8

# No [post_write_hooks]: infra/migrations/versions/ is excluded from ruff and
# black (see pyproject.toml), and the previous hooks pointed at POSIX-only
# .venv/bin paths that do not exist on Windows.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
