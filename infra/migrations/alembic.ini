# Alembic configuration — INVENTORY Tory central PostgreSQL migrations
# Full migration environment (env.py, script.py.mako, versions/) added in Issue 03.

[alembic]
# Path to migration scripts directory
script_location = %(here)s

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Database URL — override via ALEMBIC_DB_URL env var or edit directly for local use
sqlalchemy.url = postgresql+asyncpg://invtory:changeme@localhost:5432/invtory

# Truncate long messages in the console
truncate_slug_length = 40

# Output encoding
output_encoding = utf-8

[post_write_hooks]
# Run ruff + black on newly generated migration files
hooks = ruff, black
ruff.type = exec
ruff.executable = %(here)s/../../.venv/bin/ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME
black.type = exec
black.executable = %(here)s/../../.venv/bin/black
black.options = REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
