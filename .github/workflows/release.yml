name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify version consistency (manifests + tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check version consistency
        run: node scripts/check_versions.js

  release:
    needs: verify-version
    strategy:
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-latest
          - target: linux-x86_64
            runner: ubuntu-22.04

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file patchelf libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.1-0 librsvg2-dev libssl-dev libxdo-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: |
          cd apps/desktop
          npm ci

      - name: Build Tauri app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # Linux only (ignored on Windows): tell linuxdeploy not to strip the
          # AppImage payload — strip can corrupt the ELF and produce an
          # AppImage that fails to launch on users' machines.
          NO_STRIP: "true"
        run: |
          cd apps/desktop

          # Fail loudly if the build-time API URL is missing — this is the
          # #1 cause of blank-window CI builds.  The secret must be set in
          # GitHub repo Settings → Secrets → Actions.
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL secret is not set. The built app will open to a blank window."
            echo "Set it in GitHub repo Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Patch tauri.conf.json: skip WiX bundling on Windows
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            // On Windows, only build NSIS — skip MSI which requires WiX
            // and fails with 'file not found' on GitHub Actions runners.
            // Linux keeps its default targets (AppImage, deb).
            if (process.platform === 'win32' && cfg.bundle) {
              cfg.bundle.targets = ['nsis'];
            }
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2) + '\n');
          "

          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            npx tauri build \
              --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
          fi

      # ── Verify Linux bundles before uploading ─────────────────────────────
      # Past releases shipped no .deb/.rpm (and v1.1.7 shipped no installers
      # at all).  Fail loudly here instead of publishing an incomplete release.
      - name: Verify Linux bundles exist
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=apps/desktop/src-tauri/target/release/bundle
          ok=1
          for pattern in \
            "appimage/*.AppImage" \
            "appimage/*.AppImage.sig" \
            "deb/*.deb" \
            "rpm/*.rpm"; do
            matches=( $BUNDLE/$pattern )
            if [ ! -e "${matches[0]}" ]; then
              echo "::error::Missing release bundle: $BUNDLE/$pattern"
              ok=0
            else
              ls -la "${matches[@]}"
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "Bundle directory listing:"
            ls -laR "$BUNDLE" || true
            exit 1
          fi

      # ── Windows ──────────────────────────────────────────────────────────────────────
      # Upload the installer (.exe) and its updater signature (.exe.sig), plus .zip if generated.
      # draft: false ensures the release is immediately visible at /releases/latest.
      - name: Upload Windows release assets
        if: matrix.target == 'windows-x86_64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip.sig

      # ── Linux ─────────────────────────────────────────────────────────────────────────
      # Upload AppImage and its signature (.AppImage + .AppImage.sig), plus tarball if generated.
      - name: Upload Linux release assets
        if: matrix.target == 'linux-x86_64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/*.tar.gz
            apps/desktop/src-tauri/target/release/bundle/appimage/*.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb.sig
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm.sig

      - name: Upload Windows workflow artifacts
        if: matrix.target == 'windows-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/invenTory_*_x64-setup.exe*
          retention-days: 7

      - name: Upload Linux workflow artifacts
        if: matrix.target == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/invenTory_*_amd64.AppImage*
          retention-days: 7

  create-manifest:
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Download all artifacts
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        uses: actions/download-artifact@v4

      - name: Create manifest
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          set -euo pipefail

          # Extract version from tag (strip leading 'v')
          VERSION=${GITHUB_REF#refs/tags/v}

          # Locate the downloaded artifacts.
          # In Tauri v2 with createUpdaterArtifacts: true:
          # Windows: invenTory_<VERSION>_x64-setup.exe + .sig
          # Linux:   invenTory_<VERSION>_amd64.AppImage + .sig
          # (fallback to *.tar.gz only if the AppImage is missing)
          WIN_INSTALLER_FILE=$(find windows-installer -name 'invenTory_*_x64-setup.exe' ! -name '*.sig' -print -quit)
          LINUX_INSTALLER_FILE=$(find linux-appimage -name 'invenTory_*_amd64.AppImage' ! -name '*.sig' -print -quit)
          if [ -z "$LINUX_INSTALLER_FILE" ]; then
            LINUX_INSTALLER_FILE=$(find linux-appimage -name '*.tar.gz' ! -name '*.sig' -print -quit)
          fi

          # Fail loudly if any required updater file is missing
          for VAR_NAME in WIN_INSTALLER_FILE LINUX_INSTALLER_FILE; do
            FILE="${!VAR_NAME}"
            if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
              echo "::error::Required updater artifact not found: ${VAR_NAME} (${FILE})"
              echo "Ensure the build job uploads installer/bundle and corresponding .sig files."
              exit 1
            fi
          done

          # Signatures must sit next to their artifacts (tauri-cli sign_updaters)
          WIN_SIG_FILE="${WIN_INSTALLER_FILE}.sig"
          LINUX_SIG_FILE="${LINUX_INSTALLER_FILE}.sig"
          for VAR_NAME in WIN_SIG_FILE LINUX_SIG_FILE; do
            FILE="${!VAR_NAME}"
            if [ ! -f "$FILE" ]; then
              echo "::error::Updater signature not found: ${FILE}"
              echo "Check CI logs for a tauri sign_updaters key-mismatch warning."
              exit 1
            fi
          done

          LINUX_BASENAME=$(basename "$LINUX_INSTALLER_FILE")
          case "$LINUX_BASENAME" in
            *.AppImage) ;;
            *)
              echo "::warning::Linux updater URL points at ${LINUX_BASENAME} — not an AppImage; .deb/.rpm/extracted installs will not receive this update."
              ;;
          esac

          WIN_SIG=$(cat "$WIN_SIG_FILE")
          LINUX_SIG=$(cat "$LINUX_SIG_FILE")
          WIN_BASENAME=$(basename "$WIN_INSTALLER_FILE")
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DOWNLOAD_BASE="https://github.com/Izaek256/inven-Tory/releases/download/v${VERSION}"

          # Both manifests share identical content; jq guarantees well-formed
          # JSON (heredoc whitespace was a past footgun) and correct escaping.
          build_manifest() {
            jq -n \
              --arg version "$VERSION" \
              --arg notes "Release ${VERSION}" \
              --arg pub_date "$PUB_DATE" \
              --arg win_sig "$WIN_SIG" \
              --arg linux_sig "$LINUX_SIG" \
              --arg win_url "${DOWNLOAD_BASE}/${WIN_BASENAME}" \
              --arg linux_url "${DOWNLOAD_BASE}/${LINUX_BASENAME}" \
              '{
                version: $version,
                notes: $notes,
                pub_date: $pub_date,
                platforms: {
                  "windows-x86_64": { signature: $win_sig, url: $win_url },
                  "linux-x86_64": { signature: $linux_sig, url: $linux_url }
                }
              }'
          }

          build_manifest > latest-windows-x86_64.json
          build_manifest > latest-linux-x86_64.json

          for f in latest-windows-x86_64.json latest-linux-x86_64.json; do
            if ! jq -e '
              .version and .notes and .pub_date
              and .platforms["windows-x86_64"].signature
              and .platforms["windows-x86_64"].url
              and .platforms["linux-x86_64"].signature
              and .platforms["linux-x86_64"].url
            ' "$f" > /dev/null; then
              echo "::error::$f failed validation"
              cat "$f"
              exit 1
            fi
            echo "--- $f ---"
            jq . "$f"
          done

      - name: Upload manifest to release
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: latest-*.json
          append_body: true
