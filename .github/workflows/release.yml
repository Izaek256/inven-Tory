name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-latest
          - target: linux-x86_64
            runner: ubuntu-22.04

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: |
          cd apps/desktop
          npm ci

      - name: Build Tauri app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          cd apps/desktop

          # Fail loudly if the build-time API URL is missing — this is the
          # #1 cause of blank-window CI builds.  The secret must be set in
          # GitHub repo Settings → Secrets → Actions.
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL secret is not set. The built app will open to a blank window."
            echo "Set it in GitHub repo Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Patch tauri.conf.json: skip WiX bundling on Windows
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            // On Windows, only build NSIS — skip MSI which requires WiX
            // and fails with 'file not found' on GitHub Actions runners.
            // Linux keeps its default targets (AppImage, deb).
            if (process.platform === 'win32' && cfg.bundle) {
              cfg.bundle.targets = ['nsis'];
            }
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2) + '\n');
          "

          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            npx tauri build \
              --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"pubkey":""}}}'
          fi

      # ── Windows ──────────────────────────────────────────────────────────────────────
      # Upload the installer (.exe) and its updater signature (.exe.sig), plus .zip if generated.
      # draft: false ensures the release is immediately visible at /releases/latest.
      - name: Upload Windows release assets
        if: matrix.target == 'windows-x86_64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.zip.sig

      # ── Linux ─────────────────────────────────────────────────────────────────────────
      # Upload AppImage and its signature (.AppImage + .AppImage.sig), plus tarball if generated.
      - name: Upload Linux release assets
        if: matrix.target == 'linux-x86_64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/*.tar.gz
            apps/desktop/src-tauri/target/release/bundle/appimage/*.tar.gz.sig

      - name: Upload Windows workflow artifacts
        if: matrix.target == 'windows-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/invenTory_*_x64-setup.exe*
          retention-days: 7

      - name: Upload Linux workflow artifacts
        if: matrix.target == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/invenTory_*_amd64.AppImage*
          retention-days: 7

  create-manifest:
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Download all artifacts
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        uses: actions/download-artifact@v4

      - name: Create manifest
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          # Extract version from tag (strip leading 'v')
          VERSION=${GITHUB_REF#refs/tags/v}

          # Locate the downloaded artifacts.
          # In Tauri v2 with createUpdaterArtifacts: true:
          # Windows: invenTory_<VERSION>_x64-setup.exe + invenTory_<VERSION>_x64-setup.exe.sig
          # Linux: invenTory_<VERSION>_amd64.AppImage + invenTory_<VERSION>_amd64.AppImage.sig
          WIN_INSTALLER_FILE=$(find windows-installer \( -name 'invenTory_*_x64-setup.exe' -o -name '*.exe.zip' \) ! -name '*.sig' -print -quit)
          WIN_SIG_FILE=$(find windows-installer \( -name 'invenTory_*_x64-setup.exe.sig' -o -name '*.exe.zip.sig' \) -print -quit)
          LINUX_INSTALLER_FILE=$(find linux-appimage \( -name 'invenTory_*_amd64.AppImage' -o -name '*.tar.gz' \) ! -name '*.sig' -print -quit)
          LINUX_SIG_FILE=$(find linux-appimage \( -name 'invenTory_*_amd64.AppImage.sig' -o -name '*.tar.gz.sig' \) -print -quit)

          # Fail loudly if any required updater file is missing
          for VAR_NAME in WIN_INSTALLER_FILE WIN_SIG_FILE LINUX_INSTALLER_FILE LINUX_SIG_FILE; do
            FILE="${!VAR_NAME}"
            if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
              echo "::error::Required updater artifact not found: ${VAR_NAME} (${FILE})"
              echo "Ensure the build job uploads installer/bundle and corresponding .sig files."
              exit 1
            fi
          done

          WIN_SIG=$(cat "$WIN_SIG_FILE")
          LINUX_SIG=$(cat "$LINUX_SIG_FILE")

          WIN_BASENAME=$(basename "$WIN_INSTALLER_FILE")
          LINUX_BASENAME=$(basename "$LINUX_INSTALLER_FILE")

          # Build windows manifest.
          cat > latest-windows-x86_64.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "https://github.com/Izaek256/inven-Tory/releases/download/v${VERSION}/${WIN_BASENAME}"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/Izaek256/inven-Tory/releases/download/v${VERSION}/${LINUX_BASENAME}"
              }
            }
          }
          EOF

          # Build linux manifest (same cross-platform content)
          cat > latest-linux-x86_64.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "https://github.com/Izaek256/inven-Tory/releases/download/v${VERSION}/${WIN_BASENAME}"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/Izaek256/inven-Tory/releases/download/v${VERSION}/${LINUX_BASENAME}"
              }
            }
          }
          EOF

      - name: Upload manifest to release
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: latest-*.json
          append_body: true
